name: CI/CD Pipeline - Devsu Demo
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
jobs:
  build-test-analyze:
    name: Build, Tests, Coverage & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin, cache: maven }
      - name: Code Build
        run: ./mvnw -B clean compile
      - name: Unit Tests + Coverage (JaCoCo + umbral)
        run: ./mvnw -B verify
      - name: Static Code Analysis (SonarCloud)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
  security-scan:
    name: Vulnerability Scan (deps & secrets)
    runs-on: ubuntu-latest
    needs: build-test-analyze
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  k8s-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -strict k8s/
  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [security-scan, k8s-validate]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (una sola vez)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan de la imagen
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push (la misma imagen escaneada)
        run: docker push --all-tags ${{ steps.vars.outputs.image }}
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Crear clúster Kubernetes (kind)
        uses: helm/kind-action@v1
        with: { cluster_name: devsu }
      - name: Instalar metrics-server (necesario para el HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=120s
      - name: Desplegar
        env:
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl -n devsu-demo create secret generic demo-app-secret \
            --from-literal=USERNAME_DB="$DB_USER" \
            --from-literal=PASSWORD_DB="$DB_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/
          kubectl -n devsu-demo set image deployment/demo-app-deployment \
            demo-app=${{ needs.docker.outputs.image }}:${{ github.sha }}
          kubectl -n devsu-demo rollout status deployment/demo-app-deployment --timeout=240s
      - name: Smoke test
        run: |
          kubectl -n devsu-demo port-forward svc/demo-app-service 8080:80 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          curl -sf --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8080/api/users
      - name: Esperar métricas del HPA
        run: |
          for i in $(seq 1 12); do
            kubectl -n devsu-demo get hpa demo-app-hpa -o jsonpath='{.status.currentMetrics}' | grep -q cpu && break
            sleep 10
          done
      - name: Estado final
        if: always()
        run: kubectl -n devsu-demo get all,hpa,pdb,ingress
