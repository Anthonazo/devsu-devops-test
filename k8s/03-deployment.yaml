apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-deployment
  namespace: devsu-demo
  labels:
    app: demo-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: demo-app }
  template:
    metadata:
      labels: { app: demo-app }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: demo-app } }
      containers:
        - name: demo-app
          image: ghcr.io/anthonazo/devsu-devops-test:latest
          imagePullPolicy: Always
          ports:
            - { containerPort: 8000, name: http }
          envFrom:
            - configMapRef: { name: demo-app-config }
            - secretRef:    { name: demo-app-secret }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
          startupProbe:
            httpGet: { path: /api/actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /api/actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp,  mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp,  emptyDir: {} }
